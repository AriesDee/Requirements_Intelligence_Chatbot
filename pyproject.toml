[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ric"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ric"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]